<section class="hero" data-hero aria-label="EOS, Enemy of Swag">
  <div class="hero__media" aria-hidden="true">
    <video class="hero__video" data-autoplay autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback poster="/media/eos-film-poster.jpg" width="720" height="720">
      <source src="/media/eos-film.mp4" type="video/mp4">
      <source src="/media/eos-film.webm" type="video/webm">
    </video>
    <div class="hero__tint"></div>
    <div class="hero__vignette"></div>
    <canvas class="hero__embers" data-embers></canvas>
  </div>
  <div class="hero__content">
    <img class="hero__mark" src="/img/eos-sigil.webp" alt="" width="260" height="655" fetchpriority="high">
    <p class="eyebrow hero__eyebrow" data-if="{{hero.eyebrow}}">{{hero.eyebrow}}</p>
    <h1 class="hero__title" aria-label="{{hero.title}}">{{{heroTitleLines}}}</h1>
    <p class="hero__sub">{{hero.subtitle}}</p>
    <a class="btn btn--ghost hero__cta" href="{{hero.ctaLink}}"><span>{{hero.ctaLabel}}</span><svg class="btn__arrow"><use href="#i-arrow"/></svg></a>
  </div>
</section>
