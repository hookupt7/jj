<div class="pdp" data-product="{{handle}}">
  <nav class="crumbs wrap" aria-label="Breadcrumb"><a href="/">EOS</a><span>/</span><a href="/shop">Shop</a><span>/</span><span data-crumb-title>{{productTitle}}</span></nav>
  <div class="pdp__grid wrap">
    <div class="pdp__media">
      <div class="pdp__stagebox" data-stagebox><div class="pdp__ph skel"></div></div>
      <div class="pdp__views" data-views></div>
    </div>
    <div class="pdp__info" data-pinfo aria-busy="true">
      <div class="pdp__skel"><span></span><span></span><span></span></div>
    </div>
  </div>
  <section class="pdp__focus wrap" data-focus hidden></section>
  <section class="related wrap" data-related hidden aria-labelledby="related-title">
    <header class="section-head"><p class="section-index"><span class="num">&#8224;</span><span>More from EOS</span></p><h2 class="section-head__title display" id="related-title">You may also like</h2></header>
    <div class="products-grid" data-related-grid></div>
  </section>
  <section class="related wrap" data-recent hidden aria-labelledby="recent-title">
    <header class="section-head"><p class="section-index"><span class="num">&#8224;</span><span>Recently viewed</span></p><h2 class="section-head__title display" id="recent-title">Recently viewed</h2></header>
    <div class="products-grid products-grid--small" data-recent-grid></div>
  </section>
</div>
<div class="buybar" data-buybar hidden><div class="buybar__in"><div class="buybar__txt"><span class="buybar__title" data-buybar-title></span><span class="buybar__price" data-buybar-price></span></div><button class="btn btn--blood buybar__btn" type="button" data-buybar-add>Add to bag</button></div></div>
