<section class="page-hero">
  <div class="wrap page-hero__grid">
    <p class="section-index"><span class="num">&#8224;</span><span>Tracking</span></p>
    <h1 class="page-hero__title display">Where is my order</h1>
    <p class="page-hero__lede">Enter the order number from your confirmation and the phone number you used at checkout.</p>
  </div>
</section>
<section class="wrap track">
  <form class="track__form" data-track-form novalidate>
    <label class="field"><span>Order number</span><input name="orderNumber" placeholder="#D12" required maxlength="20" autocomplete="off"></label>
    <label class="field"><span>Phone</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20"></label>
    <button class="btn btn--blood" type="submit"><span>Find it</span></button>
    <p class="form-msg" data-form-msg role="status"></p>
  </form>
  <div class="track__result" data-track-result aria-live="polite"></div>
</section>
